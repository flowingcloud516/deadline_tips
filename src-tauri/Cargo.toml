[package]
name = "deadline-tips"
version = "0.2.0"
description = "A lightweight deadline desktop companion"
authors = ["Deadline Tips contributors"]
edition = "2021"

[lib]
name = "deadline_tips_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
